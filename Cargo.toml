[package]
name = "choochoo"
version = "0.1.0"
edition = "2021"
description = "Manage stacked PR trains on GitHub"
license = "MIT OR Apache-2.0"
repository = "https://github.com/choochoo/choochoo"
default-run = "choo"

[[bin]]
name = "choo"
path = "src/main.rs"

[lib]
name = "choochoo"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8"
ratatui = "0.30"
crossterm = "0.29"
toml = "1.1.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
